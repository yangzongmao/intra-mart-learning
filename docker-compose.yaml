services:
  open-webui:
    container_name: open-webui
    image: ghcr.io/open-webui/open-webui:main
    environment:
      - MODEL_DOWNLOAD_DIR=/models
      - OLLAMA_API_BASE_URL=http://ollama:11434
      - OLLAMA_API_URL=http://ollama:11434
      - OPENCLAW_URL=http://openclaw:3000
      - LOG_LEVEL=debug
      - WEBUI_SECRET_KEY=
    volumes:
      - data:/data
      - models:/models
      - open-webui:/app/backend/data
    ports:
      - "9080:8080"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    depends_on:
      - ollama
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ollama-net
    restart: unless-stopped
    
  ollama:
    container_name: ollama
    image: ollama/ollama:latest
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_VISIBLE_DEVICES=0
      - LOG_LEVEL=debug
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              count: all
    volumes:
      - ollama:/root/.ollama
      - models:/models
    ports:
      - "11434:11434"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      - ollama-net
    restart: unless-stopped

  openclaw:
    image: ghcr.io/openclaw/openclaw:main
    container_name: openclaw
    user: root
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - WORKSPACE=/workspace
      - OPENCLAW_GATEWAY_TOKEN=AABBOLLAMA111222HOST111222HOST1
    volumes:
      - ./ai_work:/workspace
    ports:
      - "3000:3000"
      - "18789:18789"
    depends_on:
      - ollama
    networks:
      - ollama-net
    
volumes:
  data:
  models:
  ollama:
  open-webui:
networks:
  ollama-net:
    driver: bridge